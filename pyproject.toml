[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-cost"
version = "0.1.0"
description = "Estimate and report LLM token costs from an overridable price table"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "kmartin918" }]
keywords = ["llm", "tokens", "pricing", "cost", "finops", "openai", "anthropic"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
"llm-cost" = "llm_cost.cli:main"

[tool.setuptools]
packages = ["llm_cost"]
